# Common Application Configuration
# Shared baseline for all environments. Profile-specific configurations live in
# application-dev.properties and application-prod.properties.

spring.application.name=feeder

# Defaults to the in-memory H2 profile (dev) so a fresh checkout or test suite runs with no setup.
# Production activates prod through the SPRING_PROFILES_ACTIVE environment variable.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

logging.file.path=logs

# JPA
# validate makes Hibernate compare the mapped entities against the live schema and refuse to
# start on a mismatch. Combined with Flyway below, the migrations are the single source of truth
# for the schema and Hibernate never issues CREATE or ALTER.
spring.jpa.hibernate.ddl-auto=validate

# Keeps the persistence context from living past the request. Without it a lazy association
# would quietly trigger a query after the response is being rendered; with it, anything not loaded
# inside the transaction fails loudly instead.
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Auth (Common Token Settings)
# Distinguishes this API's tokens from any other JWT, Google's included.
app.jwt.issuer=feeder
# Token validity duration. When this elapses the frontend repeats Google sign-in.
app.jwt.expiration=1h
