# Server
# Dynamic port binding for containerized and PaaS environments (e.g. Cloud Run, Render, Railway, AWS, Heroku)
# while defaulting to 8080.
server.port=${PORT:8080}

# JPA
# SQL statement logging is disabled in production to protect sensitive parameter values in logs
# and avoid performance overhead.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Datasource - PostgreSQL
# Production connects to a persistent PostgreSQL database. In accordance with 12-factor principles,
# all credentials and host endpoints are supplied exclusively via environment variables.
# Compatible with standard Spring Boot environment variables (SPRING_DATASOURCE_*) as well as
# standard cloud provider conventions (DATABASE_URL / DB_*).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feeder}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:feeder}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Connection Pool (HikariCP)
# Production-ready pool sizing and timeouts to avoid connection starvation and stale sockets.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Explicitly ensure H2 console is disabled in production
spring.h2.console.enabled=false

# Auth
# Real Google OAuth client credentials, a strong HS256 JWT secret (>= 32 characters), and allowed
# browser origins must be provided via environment variables. Empty defaults cause @Validated on
# AuthProperties to fail fast at startup if any required variable is missing.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Logging
# Root logging level set to INFO, keeping noisy debug output silenced in production.
logging.level.root=INFO
logging.level.com.threedimensional.feeder=INFO
