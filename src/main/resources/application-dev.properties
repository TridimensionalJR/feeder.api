# Server
server.port=8080

# JPA
# Statement logging for development only.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource - H2
# In-memory and non-persistent: the schema is rebuilt from the Flyway migrations on every start,
# so migrations can be edited freely while developing.
spring.datasource.url=jdbc:h2:mem:feederdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=feeder
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auth
# Throwaway values so a fresh checkout and the test suite boot with no setup. Set GOOGLE_CLIENT_ID
# to a real client id to try the actual Google sign-in against a local frontend. The secret below is
# public in this repository: it must never reach a deployed environment.
app.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id.apps.googleusercontent.com}
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# OpenAPI / Swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
